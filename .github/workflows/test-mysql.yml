name: Run Feature Tests (MySQL)

on:
  push:
    branches: [ "main", "master", "SPRINT-*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-mysql:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo_mysql, zip, gd, dom, curl, libxml, mbstring
        ini-values: memory_limit=512M
        coverage: none

    - name: Get Composer Cache Directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer Dependencies
      uses: actions/cache@v3
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install Dependencies
      run: composer install --no-interaction --prefer-dist --optimize-autoloader

    - name: Copy .env
      run: cp .env.example .env

    - name: Generate Key
      run: php artisan key:generate

    - name: Configure PHPUnit for MySQL
      run: |
        sed -i 's/value="sqlite"/value="mysql_test"/g' phpunit.xml

    - name: Verify MySQL Migrations
      env:
        DB_CONNECTION: mysql_test
        MYSQL_TEST_HOST: 127.0.0.1
        MYSQL_TEST_PORT: 3306
        MYSQL_TEST_DATABASE: testing_test
        MYSQL_TEST_USERNAME: root
        MYSQL_TEST_PASSWORD: password
      run: php artisan migrate:fresh --database=mysql_test --force

    - name: Run Tests (MySQL)
      env:
        DB_CONNECTION: mysql_test
        MYSQL_TEST_HOST: 127.0.0.1
        MYSQL_TEST_PORT: 3306
        MYSQL_TEST_DATABASE: testing_test
        MYSQL_TEST_USERNAME: root
        MYSQL_TEST_PASSWORD: password
      run: php artisan test --filter=CustomerReceivablesReportTest
